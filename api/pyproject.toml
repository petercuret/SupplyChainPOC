[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
